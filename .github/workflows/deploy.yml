name: Build & Deploy ScholaPro

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - live

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/scholapro

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy-staging:
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/scholapro
            docker compose -f docker-compose.staging.yml pull scholapro-staging
            docker compose -f docker-compose.staging.yml up -d scholapro-staging

  deploy-live:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'live'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to live
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/scholapro
            docker compose -f docker-compose.live.yml pull school4
            docker compose -f docker-compose.live.yml up -d school4
